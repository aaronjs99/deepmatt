[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmatt"
version = "0.1.0"
description = "Deep Manifold Attention: Transformer-Guided Natural Formation Flying in Cislunar Space"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "MIT" }
authors = [
    { name = "Aaron John-Sabu", email = "aaronjs@ucla.edu" },
]
dependencies = [
    "numpy",
    "scipy",
    "gekko",
    "sympy",
    "pandas",
    "pyyaml",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
]
